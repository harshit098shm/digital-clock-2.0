<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>
<!-- Font Awesome CDN for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Orbitron Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Orbitron",sans-serif;
}

:root{
    --bg:#d8d8d8;
    --card:#efefef;
    --text:#222;
    --box:#f5f5f5;
    --shadow1:8px 8px 18px rgba(0,0,0,.18);
    --shadow2:-8px -8px 18px rgba(255,255,255,.9);
}

body.dark{
    --bg:#2b2b2b;
    --card:#353535;
    --text:#fff;
    --box:#404040;
    --shadow1:8px 8px 18px rgba(0,0,0,.55);
    --shadow2:-4px -4px 10px rgba(255,255,255,.05);
}

body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.4s;
}

.wrapper{
    text-align:center;
    animation: fadeIn 1s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.heading{
    margin-bottom:80px;
    color:var(--text);
    letter-spacing:3px;
    transition:.3s;
}

.container{
    width:750px;
    padding:35px 30px 40px;
    border-radius:25px;
    background:var(--card);
    position:relative;
    box-shadow:var(--shadow1),var(--shadow2);
    transition:.4s;
}

/*  Icons  */

.theme-icons{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
}

.theme-btn{
    width:55px;
    height:55px;
    border:none;
    outline:none;
    border-radius:50%;
    cursor:pointer;
    background:var(--box);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    box-shadow:var(--shadow1),var(--shadow2);
    transition:.3s;
}

.theme-btn:hover{
    transform:translateY(-4px) scale(1.06);
}

#lightBtn{
    color:#FFC107;
}

#darkBtn{
    color:#6C63FF;
}

/*  Clock  */

.time{
    margin-top:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
}

.box{
    width:120px;
    height:120px;
    background:var(--box);
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:var(--shadow1),var(--shadow2);
    overflow: hidden; /* Clips scrolling elements */
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.box:hover {
    transform: translateY(-5px);
}

.number{
    font-size:45px;
    font-weight:700;
    color:var(--text);
    display: inline-block;
}

/* Scrolling / Ticker Animation */
.scroll-animation {
    animation: scrollUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes scrollUp {
    0% {
        transform: translateY(100%);
        opacity: 0;
    }
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

.label{
    margin-top:10px;
    font-size:13px;
    text-transform:uppercase;
    color:var(--text);
    opacity:.8;
}

.colon{
    font-size:45px;
    color:var(--text);
    font-weight:bold;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}

.am-pm{
    width:70px;
    height:70px;
    border-radius:18px;
    background:var(--box);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    color:var(--text);
    box-shadow:var(--shadow1),var(--shadow2);
}

.date{
    margin-top:35px;
    color:var(--text);
    font-size:17px;
    letter-spacing:1px;
}

/*  Responsive  */

@media(max-width:800px){

.container{
    width:95%;
}

.time{
    flex-wrap:wrap;
}

.box{
    width:95px;
    height:95px;
}

.number{
    font-size:34px;
}

.colon{
    display:none;
}

.am-pm{
    width:60px;
    height:60px;
}
}
</style>
</head>
<body>

<div class="wrapper">

    <h1 class="heading">DIGITAL CLOCK</h1>

    <div class="container">

        <div class="theme-icons">

            <button class="theme-btn" id="darkBtn">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button class="theme-btn" id="lightBtn">
                <i class="fa-solid fa-sun"></i>
            </button>

        </div>

        <div class="time">

            <div class="box">
                <span class="number" id="hours">08</span>
                <span class="label">Hours</span>
            </div>

            <span class="colon">:</span>

            <div class="box">
                <span class="number" id="minutes">45</span>
                <span class="label">Minutes</span>
            </div>

            <span class="colon">:</span>

            <div class="box">
                <span class="number" id="seconds">59</span>
                <span class="label">Seconds</span>
            </div>

            <div class="am-pm" id="ampm">
                AM
            </div>

        </div>

        <div class="date" id="date">
            Friday, 31 July 2026
        </div>

    </div>

</div>

<script> 
// ====================== Elements ======================

const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");
const seconds = document.getElementById("seconds");
const ampm = document.getElementById("ampm");
const date = document.getElementById("date");

const darkBtn = document.getElementById("darkBtn");
const lightBtn = document.getElementById("lightBtn");

function updateClock() {

    const now = new Date();

    let hr = now.getHours();
    let min = now.getMinutes();
    let sec = now.getSeconds();

    let period = hr >= 12 ? "PM" : "AM";

    hr = hr % 12;
    if (hr === 0) {
        hr = 12;
    }

    const formattedHr = String(hr).padStart(2, "0");
    const formattedMin = String(min).padStart(2, "0");
    const formattedSec = String(sec).padStart(2, "0");

    // Scroll animation trigger function
    function animateChange(element, newValue) {
        if (element.textContent !== newValue) {
            element.classList.remove("scroll-animation");
            void element.offsetWidth; // Trigger reflow to restart animation
            element.textContent = newValue;
            element.classList.add("scroll-animation");
        }
    }

    animateChange(hours, formattedHr);
    animateChange(minutes, formattedMin);
    animateChange(seconds, formattedSec);

    ampm.textContent = period;

    const days = [
        "Sunday", "Monday", "Tuesday", "Wednesday",
        "Thursday", "Friday", "Saturday"
    ];

    const months = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    let dayName = days[now.getDay()];
    let monthName = months[now.getMonth()];
    let today = now.getDate();
    let year = now.getFullYear();

    date.textContent = dayName + ", " + today + " " + monthName + " " + year;
}

// Run Clock Immediately
updateClock();
setInterval(updateClock, 1000);


const savedTheme = localStorage.getItem("theme");

if (savedTheme === "dark") {
    document.body.classList.add("dark");
} else {
    document.body.classList.remove("dark");
}


darkBtn.addEventListener("click", function () {
    document.body.classList.add("dark");
    localStorage.setItem("theme", "dark");
});


lightBtn.addEventListener("click", function () {
    document.body.classList.remove("dark");
    localStorage.setItem("theme", "light");
});
</script>

</body>
</html>
